; Minimal single-motor test firmware for the BARF ESP32 robot.
; Drives only GPIO 32/33 (the FL channel) from {"m":[...]} commands, with
; verbose serial logging at every step, so you can isolate whether the
; problem is "command never arrives" vs "GPIO toggles but motor doesn't spin".

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
