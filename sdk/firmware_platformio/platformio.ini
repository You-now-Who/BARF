; PlatformIO project for the BARF ESP32 robot firmware (6-motor build).
; Board: generic ESP32-D WROOM-32 dev board (CP2102/CH340 USB-UART bridge on UART0).

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
